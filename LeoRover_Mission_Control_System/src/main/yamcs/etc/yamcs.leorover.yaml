services:
  # - class: org.yamcs.http.HttpServer   # provided globally too

  # Recorders & services commonly expected by the UI
  - class: org.yamcs.archive.XtceTmRecorder
    args:
      streams: []
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true

  # Create the realtime processor 
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime

  # CFDP service
  - class: org.yamcs.cfdp.CfdpService
    name: cfdp0
    args:
      sequenceNrLength: 4
      maxPduSize: 512
      incomingBucket: "leocam"
      sleepBetweenPdus: 5
      inStream: tm_cfdp
      outStream: tc_cfdp
      localEntities:
        - name: ground
          id: 11
          bucket: "leocam"
      remoteEntities:
        - name: rover
          id: 5
      senderFaultHandlers:
        AckLimitReached: suspend
      receiverFaultHandlers:
        AckLimitReached: suspend

dataLinks:
  # Telemetry: receive ParameterData over UDP as JSON on pp_realtime
  - name: udp-params-in
    class: org.yamcs.tctm.UdpParameterDataLink
    stream: pp_realtime
    port: 10050
    json: true

  # Commands: Yamcs emits one datagram per command then the ROS bridge listens
  - name: udp-tc-out
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_realtime
    # host: 127.0.0.1
    host: 10.0.0.1
    port: 10051

  - name: udp-cfdp-out
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_cfdp
    host: 10.0.0.5
    port: 10061
    # commandPostprocessorClassName: org.yamcs.tctm.GenericCommandPostprocessor

  # UDP TC/TM pair for CFDP PDUs over UDP
  - name: udp-cfdp-in
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_cfdp
    port: 10060
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: -1
      seqCountOffset: -1

  

mdb:
  - type: xtce
    args:
      file: mdb/xtce.xml

# Streams created at startup and bound to 'realtime'
streamConfig:
  # processed-parameter streams used by the Parameter link and stored by ParameterRecorder
  param: ["pp_realtime", "sys_param", "proc_param"]

  # command history and events (UI expects these)
  cmdHist: ["cmdhist_realtime"]
  event: ["events_realtime"]

  # Alarm handling
  parameterAlarm: ["alarms_realtime"]

  # CFDP transport streams
  tm:
    - name: "tm_cfdp"

  # command streams (used by Command Releaser + udp-tc-out)
  tc:
    - name: "tc_realtime"
      processor: "realtime"

    - name: "tc_cfdp"
